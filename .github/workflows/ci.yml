# CI for the Kandoo Cloud PHP repo (فاکتور دیجیتال کندو / Kandoo Digital Invoice).
# PM ORDER 9 standing rules: GitHub Actions, PHP 8.1 + MariaDB 10.6 service, PHPUnit.
# The deployed tree needs no Composer (decision D2): CI FETCHES PHPUnit at run time, and
# config.php with FAKE CI credentials is generated at run time — never committed.
name: CI

on:
  push:
    branches:
      - arena/928d944b-kandoo-cloud-php
      - main
      - arena/ae9da477-kandoo-cloud-php
      - arena/f729618f-kandoo-cloud-php
      - arena/c079209e-kandoo-cloud-php
    tags:
      - 'stable-*'
      - 'w11-*'
      - 'o14-P-*'
      - 'o15-P-*'
      - 'o16-*'
      - 'o17-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Contract docs & golden self-consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate schemas, golden pairs and canonical-hash fixtures
        run: python3 tools/ci/validate_docs.py

  phpunit:
    env:
      KANDOO_BLOCK_REAL_SMS: '1'
    name: PHPUnit (PHP ${{ matrix.php }} + MariaDB 10.6)
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.6
        env:
          # FAKE CI-only credentials, generated per run — never real, never committed.
          MYSQL_ROOT_PASSWORD: TEST-root-pass
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: TEST_kandoo_cloud
          MYSQL_USER: TEST_kandoo_user
          MYSQL_PASSWORD: TEST-DB-PASSWORD
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Record exact PHP version
        run: php -r 'echo "::notice title=PHP runtime::PHP ", PHP_VERSION, PHP_EOL;'

      - name: Fetch PHPUnit 9 (CI may fetch PHPUnit; the deployed tree has no vendor deps)
        run: |
          wget -O phpunit.phar https://phar.phpunit.de/phpunit-9.phar
          php phpunit.phar --version

      - name: Generate CI config (FAKE values from environment)
        env:
          KANDOO_BASE_URL: https://invoice.TEST-ci.invalid
          KANDOO_DB_HOST: 127.0.0.1
          KANDOO_DB_PORT: '3306'
          KANDOO_DB_NAME: TEST_kandoo_cloud
          KANDOO_DB_USER: TEST_kandoo_user
          KANDOO_DB_PASS: TEST-DB-PASSWORD
        run: php tests/ci/write-config.php

      - name: Run migrations
        run: php bin/migrate.php

      - name: P-30 successful cron heartbeat smoke (isolated synthetic database)
        run: |
          php bin/cron.php
          php -r 'require "src/bootstrap.php"; $db=new \Kandoo\Cloud\Database(\Kandoo\Cloud\Config::load()->all()); $s=(new \Kandoo\Cloud\Operations\CronHeartbeat($db))->status(time(),120); if (!$s["fresh"]) { fwrite(STDERR,"heartbeat missing or stale\n"); exit(1); } echo "cron heartbeat fresh\n";'

      - name: Checkout pinned Hub C-83 for real transport replay
        if: matrix.php == '8.1'
        uses: actions/checkout@v4
        with:
          repository: majid-ghanbari-dost/Kandoo
          ref: 6903377f1a2e5832e63153df4306b2ee548b6f9c
          path: .hub-p23
          persist-credentials: false

      - name: Setup .NET for Hub transport replay
        if: matrix.php == '8.1'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: P-23 real C-83 Hub to PHP HTTP replay
        if: matrix.php == '8.1'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'kill "${server:-0}" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          php tests/HubReplay/prepare.php "$tmp/config.php" "$tmp/batch.json"
          export KANDOO_CONFIG="$tmp/config.php"
          php -S 127.0.0.1:18083 -t public public/index.php > "$tmp/server.log" 2>&1 & server=$!
          python3 -c 'import socket,time; s=socket.socket(); [(time.sleep(.1)) for _ in range(100) if s.connect_ex(("127.0.0.1",18083)) != 0]; s.close()'
          dotnet run --project tests/HubReplay/HubReplay.csproj -p:HubProject="$GITHUB_WORKSPACE/.hub-p23/src/Kandoo.Hub/Kandoo.Hub.csproj" -- "$tmp/batch.json"
          php tests/HubReplay/check-pages.php
          php tests/visual/p36-http-setup.php "$tmp/visual.json"
          npm install --prefix "$tmp" --no-save --no-audit --no-fund playwright-core@1.51.1
          export NODE_PATH="$tmp/node_modules"
          export P36_CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$P36_CHROME"
          node tests/visual/p36-http-screenshots.cjs "$tmp/visual.json" "$GITHUB_WORKSPACE/p36-artifacts"
          php -S 127.0.0.1:18084 -t public tests/visual/p32-router.php > "$tmp/admin.log" 2>&1 & admin_server=$!
          trap 'kill "${admin_server:-0}" "${server:-0}" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          python3 -c 'import socket,time; s=socket.socket(); [(time.sleep(.1)) for _ in range(100) if s.connect_ex(("127.0.0.1",18084)) != 0]; s.close()'
          node tests/visual/p32-http-screenshots.cjs "$GITHUB_WORKSPACE/p32-artifacts"

      - name: P-32 synthetic admin HTTP screenshots
        if: matrix.php == '8.1'
        uses: actions/upload-artifact@v4
        with:
          name: p32-synthetic-admin
          path: p32-artifacts/*.png
          if-no-files-found: error

      - name: P-36 synthetic normal HTTP screenshot
        if: matrix.php == '8.1'
        uses: actions/upload-artifact@v4
        with:
          name: p36-synthetic-normal
          path: p36-artifacts/normal.png
          if-no-files-found: error

      - name: P-36 synthetic empty HTTP screenshot
        if: matrix.php == '8.1'
        uses: actions/upload-artifact@v4
        with:
          name: p36-synthetic-empty
          path: p36-artifacts/empty.png
          if-no-files-found: error

      - name: P-36 synthetic locked HTTP screenshot
        if: matrix.php == '8.1'
        uses: actions/upload-artifact@v4
        with:
          name: p36-synthetic-locked
          path: p36-artifacts/locked.png
          if-no-files-found: error

      - name: Local in-process health load smoke test
        run: php tools/dev/load-health.php

      - name: Concurrent local MariaDB read test (synthetic, not production capacity)
        run: python3 tools/dev/load-mariadb.py --concurrency 50 --requests 100 --github-notice

      - name: Customer API synthetic read load (PHP-B P-34, local only)
        if: matrix.php == '8.1'
        run: python3 tools/dev/load-customer-read.py --concurrency 25 --requests 200 --github-notice

      - name: Customer OTP verify synthetic load (PHP-B P-34, dry-run SMS, local only)
        if: matrix.php == '8.1'
        run: python3 tools/dev/load-otp-verify.py --concurrency 10 --requests 100 --github-notice

      - name: Local kit PowerShell launch-decision smoke (synthetic; no server started)
        if: matrix.php == '8.1'
        shell: pwsh
        run: ./tests/LocalKit/demo-windows-smoke.ps1

      - name: Sample self-test (isolated database, no live SMS)
        run: php bin/selftest.php --sample

      - name: PHPUnit (unit + contract suites; golden replay on memory AND MariaDB gateways)
        env:
          KANDOO_DB_TESTS: '1'
          KANDOO_DEMO_TEST_ROOT_PASSWORD: TEST-root-pass
        run: |
          set +e
          php phpunit.phar --configuration phpunit.xml.dist --debug --log-junit phpunit-results.xml 2>&1 | tee phpunit-output.txt
          status=${PIPESTATUS[0]}
          echo "PHPUnit exit code: $status" | tee -a phpunit-output.txt
          if [ "$status" -eq 0 ]; then
            python3 -c 'import xml.etree.ElementTree as E; r=E.parse("phpunit-results.xml"); s=r.findall(".//testcase/skipped"); print("Skipped tests:", len(s)); exit(bool(s))' 2>&1 | tee -a phpunit-output.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          fi
          exit $status

      - name: Annotate PHPUnit failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          output = Path('phpunit-output.txt')
          if output.exists():
              text = output.read_text(encoding='utf-8', errors='replace')
              # GitHub caps per-step annotations; publish the diagnostic tail first.
              for line in text.splitlines()[-10:]:
                  line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + line)
          else:
              print('::error::PHPUnit output unavailable; a prior step failed.')
          PYCODE

      - name: Upload full PHPUnit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output-php-${{ matrix.php }}
          path: |
            phpunit-output.txt
            phpunit-results.xml
          if-no-files-found: warn
